name: CI

# Lint + tests on every PR into main and on every push to main (i.e. after a
# merge). Make both jobs "required" in the branch protection rule for main so a
# PR cannot be merged while they fail.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (ruff + hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1

  tests:
    name: pytest (CPU, no ComfyUI / qlip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        # CPU torch is enough: the tests cover the node layer; qlip (licensed,
        # GPU) is stubbed in tests/conftest.py
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest
      - name: Run tests
        # tests/ is the pytest root (see tests/pytest.ini): the repo root is the
        # node package itself and must not be collected as a test package
        working-directory: tests
        run: pytest -q
